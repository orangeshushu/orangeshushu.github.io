  <rect x="28" y="5" width="124" height="124" rx="28" fill="url(#panel)"/>
  <path d="M116 37a40 40 0 1 0 2 61" fill="none" stroke="#f4f6f8" stroke-linecap="round" stroke-width="10"/>
