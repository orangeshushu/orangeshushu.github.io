<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 135" role="img" aria-labelledby="title desc">
  <title id="title">CodexVisual</title>
  <desc id="desc">A dark rounded app icon with a white C-shaped ring and cyan and green quota bars.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303640"/>
