const titles=[
 ['Traditional Health Knowledge and Everyday Digital Tools'],
 ['Why NourishDay: from nutrition concern to a measurable daily record'],
 ['From one meal to a reviewable pattern'],
 ['Why capture quality matters'],
 ['From guided capture to a reviewable record']
];
const sourceLink=(href,label)=>`<a class="source-link" href="${href}" target="_blank" rel="noopener">${label}<span aria-hidden="true">↗</span></a>`;

function cover(){
 return `<div class="cover-layout"><section class="cover-copy"><p class="kicker">${text('ACADEMIC PRODUCT PRESENTATION')}</p><h1>${titles[0][lang==='en'?0:1]}</h1><p class="cover-subtitle">NourishDay &amp; iTongue</p><div class="presenter-block"><strong>Jiacheng Xie</strong><span>${D.date[lang==='en'?0:1]}</span></div></section><div class="cover-icons" aria-label="NourishDay and iTongue applications"><button class="app-orb nourish-orb" data-page="1"><span class="orb-glow"></span>${image('nourish_icon','NourishDay app icon')}<span class="orb-name">NourishDay</span><span class="orb-action">${text('Explore project')} →</span></button><button class="app-orb tongue-orb" data-page="3"><span class="orb-glow"></span>${image('itongue_icon','iTongue app icon')}<span class="orb-name">iTongue</span><span class="orb-action">${text('Explore project')} →</span></button></div></div>`;
}

function nourishBackground(){
 const i=lang==='en'?0:1;
 const backgroundPoints=[
  ['heart',text('Nutrition concern is already mainstream.'),text('Healthfulness influences food purchases, while overweight, obesity and diabetes make everyday nutrition decisions consequential.'),'[1–3]'],
  ['record',text('Concern does not equal an accurate daily picture.'),text('Self-reported intake is vulnerable to measurement error, and every food, beverage and portion must be translated into nutrient data.'),'[4]'],
  ['people',text('The question changes with the user.'),text('One person watches carbohydrates, another protein or energy, while others want to understand balance across days and weeks.'),'']
 ];
 const signals=[
  ['heart','62%',text('Healthfulness affects purchases'),'[1]'],
  ['balance','72.4%',text('U.S. adults with overweight, including obesity'),'[2]'],
  ['glucose','38.4M',text('People in the U.S. with diabetes'),'[3]'],
  ['phone','91%',text('U.S. adults owning a smartphone'),'[5]']
 ];
 return `<header class="slide-heading academic-heading"><div><p class="kicker">${text('NOURISHDAY · BACKGROUND & PURPOSE')}</p><h1>${titles[1][i]}</h1></div><p>${text('A product hypothesis grounded in a measurable information gap.')}</p></header><div class="academic-background-layout"><section class="academic-argument"><p class="section-label">${text('RESEARCH BACKGROUND')}</p><ul class="academic-bullets">${backgroundPoints.map((a,j)=>`<li style="--delay:${j*100}ms"><span class="argument-icon">${icon(a[0])}</span><div><h2>${a[1]} <sup>${a[3]}</sup></h2><p>${a[2]}</p></div></li>`).join('')}</ul><div class="design-objective"><span class="objective-icon">${icon('target')}</span><div><p>${text('DESIGN OBJECTIVE')}</p><h2>${text('Make everyday intake visible, reviewable and useful over time.')}</h2><ul><li>${text('Reduce the friction of recording familiar meals.')}</li><li>${text('Keep food identity and portion under user review.')}</li><li>${text('Connect one meal to day, week and month patterns.')}</li></ul></div></div></section><aside class="academic-evidence"><p class="section-label">${text('EVIDENCE AT A GLANCE')}</p><div class="evidence-grid">${signals.map((s,j)=>`<article class="evidence-stat" style="--delay:${j*90}ms"><span class="stat-icon">${icon(s[0])}</span><div><strong>${s[1]}</strong><p>${s[2]}</p></div><sup>${s[3]}</sup></article>`).join('')}</div><section class="academic-market" aria-label="${text('United States diet and nutrition apps market estimate')}"><div><p>${text('MARKET CONTEXT · THIRD-PARTY ESTIMATE')}</p><h2>${text('U.S. diet & nutrition apps')}</h2></div><div class="market-trajectory"><span><b>$0.67B</b><small>2024</small></span><i aria-hidden="true">→</i><em><b>+11.6%</b><small>${text('CAGR')}</small></em><i aria-hidden="true">→</i><span><b>$1.31B</b><small>2030</small></span></div><p class="market-caveat">${text('Category signal only; not a NourishDay revenue projection.')} <sup>[6]</sup></p></section></aside></div><p class="citation source-row market-sources"><span>${text('Need indicators are not customer counts.')}</span>${sourceLink(D.sources.ific,'[1] IFIC')}${sourceLink(D.sources.nchs,'[2] NCHS')}${sourceLink(D.sources.diabetes,'[3] CDC')}${sourceLink(D.sources.nci,'[4] NCI')}${sourceLink(D.sources.pew,'[5] Pew')}${sourceLink(D.sources.market,'[6] GVR')}</p>`;
}

const nourishSteps=[
 {key:'nourish_scan',label:['01 · Capture'],title:['Begin with the meal'],copy:['Choose a photo and explicitly start the upload.']},
 {key:'nourish_review',label:['02 · Review'],title:['You control the record'],copy:['Check food identity and confirm the amount before saving.']},
 {key:'calendar',label:['03 · Revisit'],title:['Return to the pattern'],copy:['A reviewed meal becomes part of a day, week and month.']}
];
function nourishDemo(){
 const s=nourishSteps[nourishStep],i=lang==='en'?0:1,key=s.key+'_'+lang;
 return `<header class="slide-heading project-heading compact-heading"><div>${image('nourish_icon','NourishDay app icon','heading-icon')}<div><p class="kicker">${text('NOURISHDAY · INTERACTIVE DEMO')}</p><h1>${titles[2][i]}</h1></div></div><div class="header-actions"><button class="project-return" data-page="0">⌂ ${text('Projects')}</button><button class="play-flow ${flowTimer?'active':''}" data-action="play" aria-pressed="${!!flowTimer}"><span class="play-symbol" aria-hidden="true">${flowTimer?'Ⅱ':'▶'}</span>${flowTimer?text('Pause flow'):text('Play flow')}</button></div></header><div class="product-demo-layout"><nav class="flow-nav" aria-label="${text('NourishDay flow')}">${nourishSteps.map((x,j)=>`<button data-step="${j}" class="${nourishStep===j?'active':''}"><span>${x.label[i]}</span><b>${x.title[i]}</b><small>${x.copy[i]}</small></button>`).join('')}</nav><div class="phone-stage"><div class="phone-shell ${nourishStep===0?'scanning':''}"><span class="phone-camera"></span>${image(key,text('NourishDay product screen'),'phone-screen')}<span class="scan-line"></span></div><div class="step-dots" aria-hidden="true">${nourishSteps.map((_,j)=>`<span class="${j===nourishStep?'active':''}"></span>`).join('')}</div></div><article class="demo-context"><p class="context-label">${s.label[i]}</p><h2>${s.title[i]}</h2><p>${s.copy[i]}</p>${nourishStep===1?`<div class="mini-calc"><p>${text('Illustrative mantou portion')}</p><div class="choices">${[60,80,100].map(g=>`<button data-grams="${g}" aria-pressed="${g===grams}" class="${g===grams?'active':''}">${g} g</button>`).join('')}</div><strong id="energy">${(grams*D.food.energyPer100g/100).toFixed(1)} <small>kcal</small></strong><span>${grams} g × 248 / 100</span></div>`:`<div class="context-principle"><span>${nourishStep===0?text('Model suggests'):text('Record becomes useful later')}</span><b>${nourishStep===0?text('User chooses what to upload'):text('Day → week → month')}</b></div>`}<p class="demo-disclaimer">${text('Product screen · demonstration values')}</p></article></div>`;
}

const tongueAspects={
 lighting:{title:['Lighting changes color'],copy:['A useful workflow must make capture conditions visible and repeatable.']},
 framing:{title:['Framing changes the region'],copy:['Guidance should help place the tongue consistently before upload.']},
 history:{title:['One image needs context'],copy:['History can connect records over time without turning a visual feature into a diagnosis.']}
};
function tongueBackground(){
 const a=tongueAspects[tongueAspect],i=lang==='en'?0:1;
 const buttons=[['lighting',text('Lighting')],['framing',text('Framing')],['history',text('History')]];
 return `<header class="slide-heading project-heading"><div>${image('itongue_icon','iTongue app icon','heading-icon')}<div><p class="kicker">${text('ITONGUE · BACKGROUND')}</p><h1>${titles[3][i]}</h1></div></div><p>${text('The input is not only an image. It is an image captured under conditions.')}</p></header><div class="tongue-background-layout"><div class="capture-themes" role="tablist">${buttons.map(b=>`<button role="tab" data-aspect="${b[0]}" aria-selected="${tongueAspect===b[0]}" class="${tongueAspect===b[0]?'active':''}"><span class="line-icon">${icon(b[0])}</span><span>${b[1]}</span></button>`).join('')}</div><article class="capture-story"><p class="story-index">0${buttons.findIndex(b=>b[0]===tongueAspect)+1}</p><h2>${a.title[i]}</h2><p>${a.copy[i]}</p><div class="research-pipeline"><span>${text('Capture')}</span><i>→</i><span>${text('Segment')}</span><i>→</i><span>${text('Review features')}</span><i>→</i><span>${text('Revisit')}</span></div></article><div class="capture-visual ${tongueAspect}"><div class="mini-phone">${image('tongue_'+lang,text('Synthetic tongue capture example'))}<span class="focus-corner c1"></span><span class="focus-corner c2"></span><span class="focus-corner c3"></span><span class="focus-corner c4"></span><span class="light-sweep"></span></div><p>${text('Synthetic development fixture')}</p></div></div><p class="citation source-row"><span>${text('Research background does not establish clinical effectiveness.')}</span>${sourceLink(D.sources.tongue,'Xie et al. 2022')}</p>`;
}

function tongueDemo(){
 const i=lang==='en'?0:1;
 return `<header class="slide-heading project-heading compact-heading"><div>${image('itongue_icon','iTongue app icon','heading-icon')}<div><p class="kicker">${text('ITONGUE · INTERACTIVE DEMO')}</p><h1>${titles[4][i]}</h1></div></div><div class="screen-switch"><button data-view="tongue" class="${tongueView==='tongue'?'active':''}">${text('Current client')}</button><button data-view="mask" class="${tongueView==='mask'?'active':''}">${text('Analysis layer')}</button></div></header><div class="tongue-demo-layout"><div class="tongue-flow"><article class="active"><span>01</span><div><h3>${text('Guided capture')}</h3><p>${text('Frame the image and review it before upload.')}</p></div></article><article><span>02</span><div><h3>${text('Explain the record')}</h3><p>${text('Present results in language the user can understand.')}</p></div></article><article><span>03</span><div><h3>${text('Return to history')}</h3><p>${text('Connect the current record with previous entries.')}</p></div></article></div><div class="tongue-phone-wrap"><div class="phone-shell tongue-phone ${tongueView==='mask'?'analyzing':''}"><span class="phone-camera"></span>${image(tongueView+'_'+lang,text('iTongue synthetic development example'),'phone-screen')}<span class="analysis-line"></span></div><p>${tongueView==='mask'?text('Synthetic local prototype · not deployed'):text('Synthetic development example')}</p></div><article class="deployment-card"><p class="context-label">${tongueView==='mask'?text('LOCAL PROTOTYPE'):text('CURRENT CLIENT')}</p><h2>${tongueView==='mask'?text('Make the analysis region visible'):text('Make capture understandable')}</h2><p>${tongueView==='mask'?text('The overlay and local adapter were tested. Production deployment remains pending.'):text('Photo selection or capture, explicit upload, results, history and bilingual UI are present in the current client.')}</p><div class="status-pill ${tongueView==='mask'?'pending':'ready'}"><span></span>${tongueView==='mask'?text('Not deployed'):text('Current workflow')}</div><p class="demo-disclaimer">${text('Clinical usefulness requires separate validation.')}</p></article></div>`;
}

const pages=[cover,nourishBackground,nourishDemo,tongueBackground,tongueDemo];
function stopFlow(){if(flowTimer){clearInterval(flowTimer);flowTimer=null}}
function render(){
 document.documentElement.lang='en';
 $('stage').className=`stage page-${page} animate`;
 $('stage').innerHTML=pages[page]();
 $('full').textContent=document.body.classList.contains('presenting')?text('Exit'):text('Fullscreen');
 $('homeNav').textContent=text('Home');
 $('nourishBackgroundNav').textContent=text('NourishDay · Background');
 $('nourishDemoNav').textContent=text('NourishDay · Demo');
 $('tongueBackgroundNav').textContent=text('iTongue · Background');
 $('tongueDemoNav').textContent=text('iTongue · Demo');
 $('prevLabel').textContent=text('Back');$('nextLabel').textContent=text('Next');
 $('page').textContent=`${String(page+1).padStart(2,'0')} / 05`;
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===page));
 $('prev').disabled=page===0;$('next').disabled=page===4;
 history.replaceState(null,'',`${location.pathname}${location.search}#${lang}/${page+1}`);
}
function go(n){stopFlow();page=Math.max(0,Math.min(4,n));render();$('stage').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
function notice(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
function toggleFlow(){if(flowTimer){stopFlow();render();return}flowTimer=setInterval(()=>{nourishStep=(nourishStep+1)%3;render()},1800);render()}
async function fullscreen(){const root=document.documentElement;if(document.body.classList.contains('presenting')){document.body.classList.remove('presenting');const leave=document.exitFullscreen||document.webkitExitFullscreen;if((document.fullscreenElement||document.webkitFullscreenElement)&&leave){try{await leave.call(document)}catch(e){}}}else{document.body.classList.add('presenting');const enter=root.requestFullscreen||root.webkitRequestFullscreen;try{if(!enter)throw new Error('unavailable');await enter.call(root)}catch(e){notice(text('Presentation view opened. Use the browser fullscreen command if needed.'))}}render()}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]'),step=e.target.closest('[data-step]'),aspect=e.target.closest('[data-aspect]'),view=e.target.closest('[data-view]'),g=e.target.closest('[data-grams]'),action=e.target.closest('[data-action]');
 if(nav){go(Number(nav.dataset.page));return}
 if(step){stopFlow();nourishStep=Number(step.dataset.step);render();return}
 if(aspect){tongueAspect=aspect.dataset.aspect;render();return}
 if(view){tongueView=view.dataset.view;render();return}
 if(g){grams=Number(g.dataset.grams);render();return}
 if(action?.dataset.action==='play')toggleFlow();
});
$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('full').onclick=fullscreen;
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('button,a,input')&&[' ','Enter'].includes(e.key))return;const k=e.key.toLowerCase();if(/^[1-5]$/.test(k)){go(Number(k)-1);return}switch(k){case ' ':case 'arrowright':e.preventDefault();go(page+1);break;case 'arrowleft':e.preventDefault();go(page-1);break;case 'home':e.preventDefault();go(0);break;case 'f':fullscreen();break;case 'escape':if(document.body.classList.contains('presenting'))fullscreen();break;}});
function syncFullscreen(){if(!document.fullscreenElement&&!document.webkitFullscreenElement&&document.body.classList.contains('presenting')){document.body.classList.remove('presenting');render()}}addEventListener('fullscreenchange',syncFullscreen);addEventListener('webkitfullscreenchange',syncFullscreen);
function hash(){const m=location.hash.match(/^#en\/([1-5])$/);if(m){page=Number(m[1])-1}}addEventListener('hashchange',()=>{stopFlow();hash();render()});hash();render();
</script>
