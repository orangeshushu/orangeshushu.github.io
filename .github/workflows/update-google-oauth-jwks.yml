name: Update Google OAuth JWKS

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-oauth-jwks
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate Google signing keys
        shell: bash
        run: |
          set -euo pipefail
          temporary_file="$(mktemp)"
          curl --fail --silent --show-error --retry 3 \
            https://www.googleapis.com/oauth2/v3/certs \
            --output "$temporary_file"
          jq -e '
            .keys
            | type == "array"
              and length > 0
              and all(.[];
                .alg == "RS256"
                and .kty == "RSA"
                and .use == "sig"
                and .e == "AQAB"
                and (.kid | type) == "string"
                and (.n | type) == "string"
              )
          ' "$temporary_file" >/dev/null
          jq --sort-keys . "$temporary_file" > itongue/google-oauth2-jwks.json

      - name: Publish only when keys change
        shell: bash
        run: |
          if git diff --quiet -- itongue/google-oauth2-jwks.json; then
            echo "Google signing keys are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itongue/google-oauth2-jwks.json
          git commit -m "chore: refresh Google OAuth signing keys"
          git push
