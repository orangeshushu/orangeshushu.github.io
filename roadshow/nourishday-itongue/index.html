<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Traditional Health Knowledge and Everyday Digital Tools | Jiacheng Xie</title>
  <meta name="description" content="NourishDay and iTongue academic product presentation by Jiacheng Xie, October 2026.">
  <meta name="theme-color" content="#10251c">
  <style>:root{
 --ink:#173126;--ink-soft:#4b6257;--green:#246c50;--green-pale:#e5eee7;
 --coral:#a8473b;--paper:#fbfaf5;--canvas:#10251c;--line:#c9d2cb;
 --focus:#b9791f;--serif:Georgia,'Times New Roman','Songti SC','STSong',serif;
 --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
 font-family:var(--sans);color:var(--ink);background:var(--canvas)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--canvas)}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,.stage:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
button:disabled{opacity:.28;cursor:default}
h1,h2,h3,p,figure{margin:0}
.skip-link{position:fixed;z-index:1000;top:8px;left:8px;transform:translateY(-160%);padding:12px 18px;background:white;color:var(--ink);border-radius:6px}
.skip-link:focus{transform:none}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px max(24px,calc((100% - 1520px)/2));color:#eaf2ec}
.section-nav,.display-tools{display:flex;align-items:center;gap:8px}
.topbar button{min-height:46px;padding:10px 14px;border:1px solid transparent;border-radius:6px;background:transparent;color:#d8e4dc;font-size:16px;transition:background-color .2s ease,color .2s ease,border-color .2s ease}
.topbar button:hover{background:#ffffff12}
.topbar button.active{background:#e4eee7;color:#173126}
.display-tools{padding-left:18px;border-left:1px solid #426051}
.display-tools button{border-color:#567063}
.stage{width:min(1520px,calc(100% - 48px));height:calc(100vh - 144px);height:calc(100dvh - 144px);min-height:620px;margin:0 auto;background:var(--paper);border-radius:5px;padding:clamp(34px,3vw,56px);overflow:hidden;position:relative}
.stage.animate>*{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:.25;transform:translateY(12px)}to{opacity:1;transform:none}}
.kicker{font-size:16px;line-height:1.2;letter-spacing:.14em;font-weight:700;color:var(--green)}
.slide-heading{margin-bottom:clamp(28px,3vh,44px)}
.slide-heading h1{font-family:var(--serif);font-size:clamp(44px,4vw,64px);line-height:1.05;letter-spacing:-.035em;margin-top:12px}
.slide-heading>p:last-child{font-size:clamp(20px,1.45vw,25px);line-height:1.45;color:var(--ink-soft);margin-top:14px}
.cover-layout{height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,.7fr);align-items:center;gap:clamp(52px,7vw,110px)}
.cover-copy h1{font-family:var(--serif);font-size:clamp(58px,5.6vw,88px);line-height:1.02;letter-spacing:-.05em;margin-top:20px;max-width:980px}
.cover-subtitle{font-size:clamp(28px,2.3vw,38px);line-height:1.25;color:var(--green);margin-top:26px}
.presenter-block{display:flex;align-items:baseline;gap:30px;margin-top:54px;padding-top:24px;border-top:2px solid var(--green);font-size:clamp(20px,1.45vw,25px)}
.presenter-block strong{font-weight:650}.presenter-block span{color:var(--ink-soft)}
.cover-icons{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.cover-icons figure{text-align:center}
.cover-icons img{display:block;width:100%;max-width:220px;aspect-ratio:1;object-fit:cover;border-radius:23%;margin:auto;box-shadow:0 18px 45px #17312620}
.cover-icons figcaption{font-size:22px;font-weight:650;margin-top:18px}
.agenda-list{display:grid;gap:0;border-bottom:1px solid var(--line)}
.agenda-link{width:100%;display:grid;grid-template-columns:70px 1fr 44px;align-items:center;text-align:left;gap:24px;padding:26px 12px;border:0;border-top:1px solid var(--line);background:transparent;transition:background-color .2s ease,padding-left .2s ease}
.agenda-link:hover,.agenda-link:focus-visible{background:var(--green-pale);padding-left:22px}
.agenda-link>span{font-size:22px;color:var(--green);font-variant-numeric:tabular-nums}
.agenda-link h2{font-family:var(--serif);font-size:clamp(30px,2.4vw,40px);line-height:1.15}
.agenda-link p{font-size:20px;line-height:1.45;color:var(--ink-soft);margin-top:7px}
.agenda-link b{font-size:34px;color:var(--green);font-weight:400}
.background-grid{display:grid;grid-template-columns:minmax(280px,.62fr) minmax(0,1.38fr);align-items:center;gap:44px}
.ingredient{width:100%;height:min(39vh,360px);object-fit:cover;border-radius:3px}
.background-grid figcaption,.screen figcaption{font-size:16px;line-height:1.4;color:var(--ink-soft);margin-top:12px;text-align:center}
.research-columns{display:grid;grid-template-columns:1fr 1fr;gap:38px}
.research-columns h2,.status-stack h2{font-family:var(--serif);font-size:clamp(27px,2vw,34px);line-height:1.15}
.research-columns .term{font-size:18px;color:var(--green);margin:15px 0}
.research-columns article>p:not(.term){font-size:20px;line-height:1.55;color:var(--ink-soft)}
.research-question{margin-top:22px!important;padding-top:18px;border-top:1px solid var(--line)}
.research-question strong{display:block;color:var(--ink);font-size:17px;margin-bottom:7px}
.citation{font-size:16px;line-height:1.45;color:var(--ink-soft);position:absolute;left:clamp(34px,3vw,56px);right:clamp(34px,3vw,56px);bottom:24px;padding-top:12px;border-top:1px solid var(--line)}
.project-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
.project-heading>div{display:flex;align-items:center;gap:22px}
.heading-icon{width:88px;height:88px;object-fit:cover;border-radius:22%;box-shadow:0 8px 24px #17312618}
.project-heading h1{margin-top:5px}
.project-heading>p{max-width:630px;text-align:right}
.nourish-grid{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(340px,1.05fr) minmax(180px,.48fr);gap:38px;align-items:center}
.tongue-grid{display:grid;grid-template-columns:minmax(300px,.8fr) minmax(340px,1.05fr) minmax(190px,.45fr);gap:38px;align-items:center}
.steps{display:grid;gap:24px}
.step{display:grid;grid-template-columns:42px 1fr;gap:14px}
.step>span{font-size:17px;color:var(--green);font-weight:700;padding-top:4px}
.step h3{font-family:var(--serif);font-size:27px;line-height:1.2}
.step p{font-size:19px;line-height:1.48;color:var(--ink-soft);margin-top:6px}
.calculator{background:var(--green-pale);padding:30px;border-radius:12px}
.calc-label{font-size:16px;letter-spacing:.12em;font-weight:700;color:var(--green)}
.calculator h2{font-family:var(--serif);font-size:36px;margin:14px 0 8px}
.calculator>p{font-size:18px;line-height:1.45;color:var(--ink-soft)}
.choices{display:flex;gap:10px;margin:24px 0}
.choices button,.screen-switch button{min-height:50px;padding:10px 18px;border:1px solid #8fab99;border-radius:7px;background:transparent;color:var(--green);font-size:18px}
.choices button:hover,.screen-switch button:hover{background:#d7e7db}
.choices button.active,.screen-switch button.active{background:var(--green);border-color:var(--green);color:white}
.energy{font-size:clamp(54px,4.8vw,76px);font-weight:650;line-height:1;color:var(--green);letter-spacing:-.04em}
.energy small{font-size:20px;font-weight:500;letter-spacing:0}
.formula{margin:12px 0 18px!important}
.data-note{font-size:16px!important;padding-top:16px;border-top:1px solid #b9cabc}
.screen{text-align:center}
.screen img{height:min(43vh,370px);max-width:100%;object-fit:contain;border-radius:18px}
.screen-switch{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.status-stack{display:grid;gap:28px;border-left:2px solid var(--line);padding-left:32px}
.status-stack article+article{padding-top:24px;border-top:1px solid var(--line)}
.status-stack h2{color:var(--coral)}
.status-stack p{font-size:20px;line-height:1.52;color:var(--ink-soft);margin-top:10px}
.slide-controls{height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px max(24px,calc((100% - 1520px)/2));color:#e6eee8}
.slide-controls button{min-height:48px;min-width:116px;border:1px solid #516d5e;border-radius:7px;background:transparent;color:#e6eee8;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;transition:background-color .2s ease}
.slide-controls button:hover{background:#ffffff12}
.slide-controls #next{justify-self:end}.slide-controls #prev{justify-self:start}
.slide-controls>span{font-size:16px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.toast{position:fixed;z-index:100;left:50%;bottom:84px;transform:translateX(-50%);padding:13px 20px;background:#e4eee7;color:var(--ink);border-radius:7px;font-size:16px;box-shadow:0 8px 28px #0004}
[hidden]{display:none!important}.noscript{padding:30px;color:white}
.presenting .topbar{height:64px}.presenting .slide-controls{height:58px}
.presenting .stage{width:100%;height:calc(100vh - 122px);height:calc(100dvh - 122px);min-height:0;border-radius:0;padding:clamp(38px,3.5vw,68px)}
.presenting .cover-copy h1{font-size:clamp(64px,6vw,104px)}
.presenting .slide-heading h1{font-size:clamp(52px,4.4vw,78px)}
@media(max-width:1180px){
 .topbar{padding-inline:18px}.section-nav{overflow-x:auto;scrollbar-width:none}.section-nav::-webkit-scrollbar{display:none}.topbar button{white-space:nowrap}
 .stage{width:calc(100% - 28px);padding:30px;min-height:580px}
 .cover-layout{grid-template-columns:1.2fr .8fr;gap:40px}.cover-copy h1{font-size:55px}.cover-icons img{max-width:170px}
 .background-grid{grid-template-columns:.42fr 1fr;gap:28px}.research-columns{gap:24px}.research-columns article>p:not(.term){font-size:17px}
 .nourish-grid,.tongue-grid{grid-template-columns:.82fr 1fr .42fr;gap:22px}.step p,.status-stack p{font-size:17px}.step h3{font-size:24px}.project-heading>p{font-size:19px}
}
@media(max-height:760px) and (min-width:801px){
 .stage{min-height:0;padding:28px 38px}.slide-heading{margin-bottom:20px}.slide-heading h1{font-size:45px}.slide-heading>p:last-child{font-size:19px;margin-top:8px}
 .cover-copy h1{font-size:58px}.presenter-block{margin-top:30px}.cover-icons img{max-width:175px}.cover-icons figcaption{font-size:19px}
 .agenda-link{padding:18px 10px}.agenda-link h2{font-size:30px}.agenda-link p{font-size:17px}
 .ingredient{height:300px}.research-columns article>p:not(.term){font-size:17px}.research-question{margin-top:14px!important;padding-top:12px}.citation{font-size:14px}
 .project-heading .heading-icon{width:70px;height:70px}.steps{gap:17px}.step h3{font-size:23px}.step p,.status-stack p{font-size:16px}.calculator{padding:22px}.calculator h2{font-size:30px}.choices{margin:16px 0}.energy{font-size:54px}.screen img{height:300px}
}
@media(max-width:800px){
 body{overflow:auto}.topbar{height:auto;min-height:72px;position:sticky;top:0;z-index:20;background:var(--canvas);align-items:flex-start;padding:10px 12px;flex-direction:column}
 .section-nav{width:100%}.display-tools{width:100%;padding:8px 0 0;border:0;border-top:1px solid #365345;justify-content:flex-end}
 .stage,.presenting .stage{width:calc(100% - 20px);height:auto;min-height:calc(100vh - 198px);min-height:calc(100dvh - 198px);padding:32px 22px;overflow:visible}
 .cover-layout{grid-template-columns:1fr;gap:42px}.cover-copy h1,.presenting .cover-copy h1{font-size:clamp(43px,12vw,58px)}.cover-icons{max-width:440px}.cover-icons img{max-width:150px}.presenter-block{margin-top:34px;flex-wrap:wrap}
 .slide-heading{margin-bottom:28px}.slide-heading h1,.presenting .slide-heading h1{font-size:42px}.slide-heading>p:last-child{font-size:18px;text-align:left}
 .agenda-link{grid-template-columns:38px 1fr 28px;gap:12px;padding:22px 4px}.agenda-link:hover{padding-left:10px}.agenda-link h2{font-size:27px}.agenda-link p{font-size:17px}
 .background-grid,.research-columns,.nourish-grid,.tongue-grid{grid-template-columns:1fr}.ingredient{height:250px}.research-columns{gap:34px}.citation{position:static;margin-top:30px;font-size:16px}
 .project-heading{display:block}.project-heading>div{align-items:center}.project-heading>p{margin-top:16px;text-align:left}.heading-icon{width:72px;height:72px}
 .steps{gap:22px}.step h3{font-size:25px}.step p,.status-stack p{font-size:18px}.status-stack{border-left:0;border-top:2px solid var(--line);padding:26px 0 0}
 .screen img{height:360px}.slide-controls{height:70px;position:sticky;bottom:0;z-index:20;background:var(--canvas);padding:8px 12px}.slide-controls button{min-width:90px}.slide-controls button span:last-child:first-child{display:none}
}
@media(max-width:430px){
 .topbar button{font-size:16px;padding:9px 11px}.display-tools{justify-content:space-between}.display-tools button{flex:1}
 .stage,.presenting .stage{min-height:0}.cover-icons{gap:18px}.cover-icons figcaption{font-size:18px}.presenter-block{gap:12px;font-size:19px}
 .cover-copy h1,.presenting .cover-copy h1{font-size:42px}.cover-subtitle{font-size:25px}
 .slide-heading h1,.presenting .slide-heading h1{font-size:37px}.agenda-link h2{font-size:25px}
 .calculator{padding:22px 18px}.choices button{padding:10px 14px}.energy{font-size:52px}.screen img{height:320px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{body{background:white}.topbar,.slide-controls,.toast{display:none!important}.stage,.presenting .stage{width:100%;height:auto;min-height:0;padding:12mm;border-radius:0;overflow:visible}}
</style>

  <script>'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
let lang='en',page=0,grams=80,tongueView='tongue',toastTimer;
const text=(en,zh)=>lang==='en'?en:zh;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=(key,alt,cls='')=>`<img class="${cls}" src="${D.assets[key]}" alt="${esc(alt)}">`;
const titles=[
 ['Traditional Health Knowledge and Everyday Digital Tools','传统健康知识与日常数字工具'],
 ['Presentation Overview','演讲目录'],
 ['Background and Research Context','背景与研究基础'],
 ['NourishDay','食养日历 NourishDay'],
 ['iTongue','iTongue 舌象分析']
];
const step=(n,h,p)=>`<div class="step"><span>${n}</span><div><h3>${h}</h3><p>${p}</p></div></div>`;
function cover(){return `<div class="cover-layout"><section class="cover-copy"><p class="kicker">${text('ACADEMIC PRODUCT PRESENTATION','学术型产品报告')}</p><h1>${titles[0][lang==='en'?0:1]}</h1><p class="cover-subtitle">NourishDay &amp; iTongue</p><div class="presenter-block"><strong>Jiacheng Xie</strong><span>${D.date[lang==='en'?0:1]}</span></div></section><div class="cover-icons" aria-label="NourishDay and iTongue applications"><figure>${image('nourish_icon','NourishDay app icon')}<figcaption>NourishDay</figcaption></figure><figure>${image('itongue_icon','iTongue app icon')}<figcaption>iTongue</figcaption></figure></div></div>`}
function agenda(){const rows=[
 ['01',2,text('Background','背景'),text('Traditional health knowledge and digital image research','传统健康知识与数字图像研究')],
 ['02',3,text('Project I · NourishDay','项目一 · 食养日历'),text('Meal review, nutrition records and seasonal food context','餐食核对、营养记录与时令饮食背景')],
 ['03',4,text('Project II · iTongue','项目二 · iTongue'),text('Guided capture, image analysis and reviewable history','引导拍摄、图像分析与历史回看')]
];return `<header class="slide-heading"><p class="kicker">${text('AGENDA','目录')}</p><h1>${titles[1][lang==='en'?0:1]}</h1><p>${text('Select a section to begin.','点击任一部分即可跳转。')}</p></header><div class="agenda-list">${rows.map(r=>`<button class="agenda-link" data-page="${r[1]}"><span>${r[0]}</span><div><h2>${r[2]}</h2><p>${r[3]}</p></div><b aria-hidden="true">→</b></button>`).join('')}</div>`}
function background(){return `<header class="slide-heading"><p class="kicker">${text('BACKGROUND','背景')}</p><h1>${titles[2][lang==='en'?0:1]}</h1></header><div class="background-grid"><figure>${image('ingredients',text('Chinese yam, goji berries, ginger and jujube','山药、枸杞、生姜与红枣'),'ingredient')}<figcaption>${text('Illustrative image','情境配图')}</figcaption></figure><div class="research-columns"><article><h2>${text('Food as cultural context','食物与文化背景')}</h2><p class="term">药食同源 · Yaoshi tongyuan</p><p>${text('Some ingredients appear in both everyday cooking and traditional Chinese medicine. NourishDay connects this context with food knowledge and daily records.','部分食材同时进入日常烹饪与传统中医药体系。食养日历把这一背景连接到食材知识与每日记录。')}</p><p class="research-question"><strong>${text('Product question','产品问题')}</strong>${text('How can a user review food identity and portion before saving a meal?','用户如何在保存一餐前核对食物身份与份量？')}</p></article><article><h2>${text('Tongue observation as an image task','舌象与图像分析')}</h2><p class="term">${text('Acquisition · segmentation · visual features','采集 · 分割 · 视觉特征')}</p><p>${text('Digital tongue-image research studies color, coating and shape. iTongue brings capture and result review into a mobile workflow.','数字舌象研究关注颜色、舌苔与形态。iTongue把拍摄与结果回看组织成移动端流程。')}</p><p class="research-question"><strong>${text('Product question','产品问题')}</strong>${text('How can lighting and framing become repeatable enough for useful analysis?','如何让光线与构图更稳定，从而支持有用的分析？')}</p></article></div></div><p class="citation">${text('Sources: National Health Commission; Xie et al., Digital tongue image analyses for health assessment (2022).','来源：国家卫健委；Xie等，Digital tongue image analyses for health assessment（2022）。')}</p>`}
function nourish(){return `<header class="slide-heading project-heading"><div>${image('nourish_icon','NourishDay app icon','heading-icon')}<div><p class="kicker">${text('PROJECT I','项目一')}</p><h1>${titles[3][lang==='en'?0:1]}</h1></div></div><p>${text('A reviewable meal record begins with food identity and portion.','可以核对的一餐记录，从食物身份与份量开始。')}</p></header><div class="nourish-grid"><div class="steps">${step('01',text('Identify the food','核对食物身份'),text('Plain mantou and a filled bun require different references.','白馒头与有馅包子需要不同参考。'))}${step('02',text('Confirm the portion','确认实际份量'),text('The user selects an amount. A photograph does not weigh a meal.','由用户选择实际份量，照片并不能称重。'))}${step('03',text('Return to the day','保存到当天'),text('The reviewed meal becomes part of the daily nutrition record.','核对后的一餐进入当天的营养记录。'))}</div><article class="calculator"><p class="calc-label">${text('INTERACTIVE EXAMPLE','交互示例')}</p><h2>${text('Plain mantou','白馒头')}</h2><p>248 kcal / 100 g · TFDA R2400201</p><div class="choices" aria-label="Portion">${[60,80,100].map(g=>`<button data-grams="${g}" aria-pressed="${g===grams}" class="${g===grams?'active':''}">${g} g</button>`).join('')}</div><div class="energy" id="energy" aria-live="polite">${(grams*D.food.energyPer100g/100).toFixed(1)} <small>kcal</small></div><p class="formula" id="formula">${grams} g × 248 / 100</p><p class="data-note">${text('Illustrative portion. Sugar and vitamin C are unavailable in this source record.','份量用于演示。此来源记录中的糖与维生素C数据缺失。')}</p></article><figure class="screen">${image('calendar_'+lang,text('NourishDay nutrition calendar','食养日历营养日历界面'))}<figcaption>${text('Daily nutrition calendar','每日营养日历')}</figcaption></figure></div>`}
function tongue(){return `<header class="slide-heading project-heading"><div>${image('itongue_icon','iTongue app icon','heading-icon')}<div><p class="kicker">${text('PROJECT II','项目二')}</p><h1>${titles[4][lang==='en'?0:1]}</h1></div></div><p>${text('A usable analysis record begins with a consistent photograph.','可以使用的分析记录，从稳定的舌象照片开始。')}</p></header><div class="tongue-grid"><div class="steps">${step('01',text('Capture','拍摄'),text('Guide framing and lighting before upload.','上传前提供构图与光线提示。'))}${step('02',text('Review','查看'),text('Present the analysis in language the user can understand.','用用户能够理解的方式展示分析结果。'))}${step('03',text('Revisit','回看'),text('Connect the current image with previous records.','将本次图像与历史记录连接。'))}</div><div class="status-stack"><article><h2>${text('Current client','当前客户端')}</h2><p>${text('Photo capture or selection, explicit upload, results, history and bilingual UI.','拍摄或选图、明确上传、结果展示、历史记录与双语界面。')}</p></article><article><h2>${text('Local segmentation prototype','本地分割原型')}</h2><p>${text('The overlay and local adapter were tested. Production deployment remains pending.','叠加界面与本地适配器已测试，生产部署仍待完成。')}</p></article></div><figure class="screen"><div class="screen-switch"><button data-view="tongue" class="${tongueView==='tongue'?'active':''}">${text('Photo','照片')}</button><button data-view="mask" class="${tongueView==='mask'?'active':''}">${text('Prototype','原型')}</button></div>${image(tongueView+'_'+lang,text('iTongue synthetic development example','iTongue合成开发样例'))}<figcaption>${tongueView==='mask'?text('Synthetic local prototype · not deployed','合成本地原型 · 尚未部署'):text('Synthetic development example','合成开发样例')}</figcaption></figure></div><p class="citation">${text('Research basis: Xie et al. (2022). Clinical effectiveness requires separate validation.','研究基础：Xie等（2022）。临床效果需要独立验证。')}</p>`}
function render(){document.documentElement.lang=lang==='en'?'en':'zh-Hans';$('stage').className=`stage page-${page} animate`;$('stage').innerHTML=[cover,agenda,background,nourish,tongue][page]();$('lang').textContent=lang==='en'?'中文':'English';$('full').textContent=document.body.classList.contains('presenting')?text('Exit','退出全屏'):text('Fullscreen','全屏');$('homeNav').textContent=text('Home','首页');$('overviewNav').textContent=text('Overview','目录');$('backgroundNav').textContent=text('Background','背景');$('prevLabel').textContent=text('Back','上一页');$('nextLabel').textContent=text('Next','下一页');$('page').textContent=`${String(page+1).padStart(2,'0')} / 05`;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',Number(b.dataset.page)===page));$('prev').disabled=page===0;$('next').disabled=page===4;history.replaceState(null,'',`${location.pathname}${location.search}#${lang}/${page+1}`)}
function go(n){page=Math.max(0,Math.min(4,n));render();$('stage').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
function notice(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
async function fullscreen(){const root=document.documentElement;if(document.body.classList.contains('presenting')){document.body.classList.remove('presenting');const leave=document.exitFullscreen||document.webkitExitFullscreen;if((document.fullscreenElement||document.webkitFullscreenElement)&&leave){try{await leave.call(document)}catch(e){}}}else{document.body.classList.add('presenting');const enter=root.requestFullscreen||root.webkitRequestFullscreen;try{if(!enter)throw new Error('unavailable');await enter.call(root)}catch(e){notice(text('Presentation view opened. Use the browser fullscreen command if needed.','已进入放映视图，也可以使用浏览器的全屏功能。'))}}render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]'),g=e.target.closest('[data-grams]'),v=e.target.closest('[data-view]');if(nav){go(Number(nav.dataset.page));return}if(g){grams=Number(g.dataset.grams);render();return}if(v){tongueView=v.dataset.view;render()}});
$('prev').onclick=()=>go(page-1);$('next').onclick=()=>go(page+1);$('lang').onclick=()=>{lang=lang==='en'?'zh':'en';render()};$('full').onclick=fullscreen;
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.target.closest('button,a,input')&&[' ','Enter'].includes(e.key))return;switch(e.key.toLowerCase()){case ' ':case 'arrowright':e.preventDefault();go(page+1);break;case 'arrowleft':e.preventDefault();go(page-1);break;case 'home':e.preventDefault();go(0);break;case 'o':go(1);break;case 'l':lang=lang==='en'?'zh':'en';render();break;case 'f':fullscreen();break;case 'escape':if(document.body.classList.contains('presenting'))fullscreen();break;}});
function syncFullscreen(){if(!document.fullscreenElement&&!document.webkitFullscreenElement&&document.body.classList.contains('presenting')){document.body.classList.remove('presenting');render()}}addEventListener('fullscreenchange',syncFullscreen);addEventListener('webkitfullscreenchange',syncFullscreen);
function hash(){const m=location.hash.match(/^#(en|zh)\/([1-5])$/);if(m){lang=m[1];page=Number(m[2])-1}}addEventListener('hashchange',()=>{hash();render()});hash();render();
</script>
</body>
</html>
